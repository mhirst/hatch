# Build Hatch installers on every tag push.
#
# Triggers:
#   - push of any tag matching v*.*.*  → build Win + Mac, publish to GH Releases
#   - manual workflow_dispatch         → build only (no publish)
#
# Each runner builds the Go daemon natively (no cross-compile), produces icons
# from the SVG sources, builds the Electron bundle, then runs electron-builder.
# electron-builder uploads .exe / .dmg as Release assets when GH_TOKEN is set
# and the run was triggered by a tag.
name: build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed for GitHub Releases upload via electron-builder

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build daemon (native)
        working-directory: desktop
        run: npm run build:daemon

      - name: Build icons
        working-directory: desktop
        run: npm run build:icons

      - name: Build Electron bundles
        working-directory: desktop
        run: npm run build

      - name: Package (${{ matrix.target }})
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing — see SIGNING.md for the path to signed builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload installer as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: hatch-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: ignore
